<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NullSpire</title>
  <desc id="desc">Soft gray 16 by 9 gradient with a blurred central circle and NullSpire title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2d4d7"/>
      <stop offset="0.5" stop-color="#96999e"/>
      <stop offset="1" stop-color="#c5c7ca"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#50545a" stop-opacity="0.88"/>
      <stop offset="0.45" stop-color="#666b72" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#666b72" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="260" fill="url(#orb)" filter="url(#blur)"/>
  <circle cx="800" cy="450" r="155" fill="url(#orb)" opacity="0.72" filter="url(#soft)"/>
  <text x="800" y="474" text-anchor="middle" fill="#f4f5f6" font-family="Inter, Arial, Helvetica, sans-serif" font-size="74" font-weight="700" letter-spacing="1.5">NullSpire</text>
</svg>
